name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérifier que l'application démarre
        run: |
          npm start &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/healthz && break || sleep 1
          done
          curl -sf http://127.0.0.1:3000/healthz

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t drdu:ci .
